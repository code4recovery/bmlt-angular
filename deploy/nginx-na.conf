# Meeting Finder at https://matthews.help/na/
#
# 1) At http level (outside any server{}), e.g. /etc/nginx/conf.d/na-cache.conf:
#      proxy_cache_path /var/cache/nginx/na_feed levels=1:2 keys_zone=na_feed:1m max_size=20m inactive=1d use_temp_path=off;
# 2) Inside the matthews.help HTTPS server{} block:
#      include snippets/nginx-na.conf;

location = /na {
    return 301 /na/;
}

# Same-origin, cached copy of the BMLT feed. The app only uses it if the direct request
# to todayna.org fails (CORS, outage). Stale copies are served if todayna.org is down.
location = /na/feed.json {
    proxy_pass https://todayna.org/bmlt/client_interface/json/?switcher=GetSearchResults&services%5B%5D=-1054&services%5B%5D=-1055&services%5B%5D=-1056&get_used_formats=1;
    proxy_ssl_server_name on;
    proxy_set_header Host todayna.org;
    proxy_set_header Accept-Encoding "";
    proxy_cache na_feed;
    proxy_cache_valid 200 15m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status;
}

# ^~ stops other regex locations in the server block (e.g. a global \.js$ rule or the
# Node proxy) from grabbing /na/ requests.
location ^~ /na/ {
    root /var/www/matthews.help;          # files live in /var/www/matthews.help/na/
    index index.html;

    # Hashed bundles never change: cache hard.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML5 routing: /na/meetings/<slug> etc. fall back to the app shell.
    try_files $uri $uri/ /na/index.html;
    add_header Cache-Control "no-cache";
}
